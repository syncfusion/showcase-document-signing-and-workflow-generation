<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>SignFlow · Document Signing and Workflow</title>
    <!-- The chosen theme is set before the first paint (same key as the reference app, design/DESIGN.md). -->
    <script>
      (function () { var t = null; try { t = localStorage.getItem('signflow.v2.theme'); } catch (e) {} if (t !== 'light' && t !== 'dark') { t = 'light'; try { if (matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'; } catch (e) {} } document.documentElement.dataset.theme = t; document.documentElement.classList.toggle('e-dark-mode', t === 'dark'); })();
    </script>
    <!-- Syncfusion theme first so the factory tokens in the app stylesheet override its variables. The onload/onerror
         flag lets the theme service know it has loaded even if Angular starts later. -->
    <link rel="stylesheet" href="/styles/syncfusion/tailwind3.css" onload="window.__sfThemeReady = true" onerror="window.__sfThemeReady = true" />
    <!-- Loading indicator styles: here because the app's CSS has not loaded yet (shared with the app's LoadingState). -->
    <style>
      :root { --app-loading-bg: #f6f8fb; --app-loading-fg: #667085; --app-loading-ring: #175cd3; --app-loading-track: #dbe5f5; }
      :root[data-theme='dark'] { --app-loading-bg: #020617; --app-loading-fg: #94a3b8; --app-loading-ring: #60a5fa; --app-loading-track: #1e3a6e; }
      html, body { margin: 0; background: var(--app-loading-bg); }
      .app-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        min-height: 240px; padding: 24px; box-sizing: border-box; color: var(--app-loading-fg);
        font: 500 14px/1.4 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      .app-loading--screen { position: fixed; inset: 0; z-index: 999; min-height: 0; background: var(--app-loading-bg); }
      .app-loading--overlay { position: absolute; inset: 0; z-index: 5; min-height: 0; background: var(--app-loading-bg); }
      .app-loading__ring { width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box;
        border: 3px solid var(--app-loading-track); border-top-color: var(--app-loading-ring); animation: app-loading-spin 0.8s linear infinite; }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .app-loading__ring { animation: none; border-color: var(--app-loading-ring); } }
    </style>
  </head>
  <body>
    <app-root><div class="app-loading app-loading--screen" role="status" aria-live="polite"><div class="app-loading__ring" aria-hidden="true"></div><div>Loading SignFlow…</div></div></app-root>
  </body>
</html>
